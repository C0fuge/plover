[libdefaults]
  default_realm = EXAMPLE.TEST
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  dns_canonicalize_hostname = false
  udp_preference_limit = 1
  ticket_lifetime = 24h
  forwardable = true
[realms]
  EXAMPLE.TEST = {
    kdc = localhost:88
    admin_server = localhost:749
  }
[domain_realm]
  localhost = EXAMPLE.TEST
