name: release a build

# Attaches a build.yml run's extension + .sha256 to a GitHub release (created if missing), e.g.
# tag hadoopfs-51b7220-afc4-duckdb-v1.5.6. Run only after hdfs-test.yml passed for that build.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: run id of a build.yml run
        required: true
      duckdb_version:
        description: DuckDB release the extension was built for
        default: v1.5.6
      tag:
        description: release tag
        required: true
      notes:
        description: release notes
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hadoopfs-${{ inputs.duckdb_version }}-linux_amd64
          path: ext
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          RUN: ${{ inputs.build_run_id }}
        run: |
          cd ext && sha256sum -c hadoopfs.duckdb_extension.sha256
          tail -c 512 hadoopfs.duckdb_extension | strings | head -4
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "${NOTES:-hadoopfs extension, linux_amd64} (build run $RUN)"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber hadoopfs.duckdb_extension hadoopfs.duckdb_extension.sha256
