name: hdfs sasl test (Kerberos, data transfer privacy)

# Runs a build's extension against a Kerberized HDFS 3.4.1 (KDC + namenode + 1..3 datanode containers, host network)
# with dfs.data.transfer.protection=privacy on non-privileged DataNode ports; reads a multi-block file. With 3
# DataNodes (replication 2) also the failover test and a 3des vs AES/CTR throughput comparison: a DataNode killed between scans and mid-scan, metadata cache on.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: run id of a build.yml run (artifact hadoopfs-<duckdb_version>-linux_amd64)
        required: true
      duckdb_version:
        description: DuckDB release the extension was built for
        default: v1.5.6
      datanodes:
        description: number of DataNodes (3 = also the failover test)
        default: "3"
      rpc_protection:
        description: hadoop.rpc.protection of the cluster
        type: choice
        options: [authentication, integrity, privacy]
        default: authentication
      dn_protection:
        description: dfs.data.transfer.protection of the DataNodes (several QOPs, e.g. authentication,privacy, also test the client's QOP choice)
        default: privacy
      cipher_suites:
        description: dfs.encrypt.data.transfer.cipher.suites of the DataNodes ("" = off); the tests then also read with the AES/CTR option and compare throughput 3des vs AES
        default: AES/CTR/NoPadding

jobs:
  hdfs-sasl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATANODES: ${{ inputs.datanodes }}
      RPC_PROTECTION: ${{ inputs.rpc_protection }}
      DN_PROTECTION: ${{ inputs.dn_protection }}
      CIPHER_SUITES: ${{ inputs.cipher_suites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hadoopfs-${{ inputs.duckdb_version }}-linux_amd64
          path: ext
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: start KDC + secure HDFS
        run: bash tests/hdfs-sasl/start.sh
      - name: test data (one Parquet file, 1 MB blocks; failover file 4 MB blocks)
        run: |
          curl -sSfL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${{ inputs.duckdb_version }}/duckdb_cli-linux-amd64.zip"
          unzip -qo duckdb.zip && mkdir -p data
          ./duckdb -c "COPY (SELECT range AS id, range % 97 AS v, md5(range::VARCHAR) AS s FROM range(300000))
            TO 'data/big.parquet' (FORMAT parquet, ROW_GROUP_SIZE 20000)"
          ls -la data
          H="docker exec -e KRB5CCNAME=/w/krb/nn.ccache nn"
          $H hdfs dfs -mkdir -p /t
          $H hdfs dfs -D dfs.blocksize=1048576 -put -f /w/data/big.parquet /t/
          $H hdfs fsck /t/big.parquet -files -blocks | grep -E "blocks|Total blocks" | head -5
          if [ "$DATANODES" -ge 3 ]; then
            ./duckdb -c "COPY (SELECT range AS id, range % 97 AS v, md5(range::VARCHAR) AS s FROM range(4000000))
              TO 'data/fo.parquet' (FORMAT parquet, ROW_GROUP_SIZE 100000)"
            $H hdfs dfs -D dfs.blocksize=4194304 -put -f /w/data/fo.parquet /t/
            $H hdfs fsck /t/fo.parquet -files -blocks -locations | grep -E "Total blocks|Average block replication" | head -5
          fi
      - name: test (AlmaLinux 8 container = the extension's runtime libs)
        run: |
          docker run --name tc -d --network host -v "$PWD:/w" -w /w -e DUCKDB_VERSION=${{ inputs.duckdb_version }} \
            -e DATANODES -e CIPHER_SUITES -e DN_PROTECTION almalinux:8 sleep infinity
          docker exec tc bash tests/hdfs-sasl/run.sh
      - name: failover test (kill DataNodes between and during scans)
        if: inputs.datanodes >= 3
        run: |
          mkdir -p ctl
          # watcher: executes "kill dnI" / "start dnI" requests of failover.sh
          ( while :; do
              if [ -f ctl/req ]; then read -r op dn < ctl/req; rm -f ctl/req; docker $op $dn >/dev/null; echo "host: $op $dn"; touch ctl/ack; fi
              sleep 0.1
            done ) &
          docker exec tc bash tests/hdfs-sasl/failover.sh
      - name: logs
        if: failure()
        run: |
          docker logs kdc 2>&1 | tail -30; docker logs nn 2>&1 | tail -80; for i in $(seq 1 "$DATANODES"); do echo "--- dn$i"; docker logs dn$i 2>&1 | grep -iE "sasl|error|exception|warn" | tail -30; done
